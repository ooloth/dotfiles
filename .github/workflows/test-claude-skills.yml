name: Test Claude

on:
  # Run on pull requests to main
  pull_request:
    branches: [main]
    paths:
      - 'tools/agents/config/skills/**/*.py'
      - 'tools/agents/config/skills/**/pyproject.toml'
      - 'tools/agents/config/skills/**/SKILL.md'
      - 'tools/agents/check-skills.py'
      - 'tools/agents/check-python.bash'
      - 'tools/agents/ruff.toml'
      - '.github/workflows/test-claude-skills.yml'

  # Run on pushes to main branch
  push:
    branches: [main]
    paths:
      - 'tools/agents/config/skills/**/*.py'
      - 'tools/agents/config/skills/**/pyproject.toml'
      - 'tools/agents/config/skills/**/SKILL.md'
      - 'tools/agents/check-skills.py'
      - 'tools/agents/check-python.bash'
      - 'tools/agents/ruff.toml'
      - '.github/workflows/test-claude-skills.yml'

  # Allow manual triggering for debugging
  workflow_dispatch:

jobs:
  skills:
    name: Skills
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        run: brew install uv

      - name: Validate skill frontmatter
        run: uv run tools/agents/check-skills.py

      # One script so CI and a local run check the same files with the same pinned rules and
      # versions. It fails when it finds no Python files, which ruff and ty would pass.
      - name: Lint, format-check and type-check Python
        run: bash tools/agents/check-python.bash

      # pytest finds test_*.py at any depth and exits 5 when it collects nothing, so a skill test
      # in a scripts/ subdirectory runs, and a run that finds no tests fails rather than passing.
      # importlib mode keeps two skills' same-named test files from colliding on import.
      - name: Run tests
        run: uv run --with pytest pytest --import-mode=importlib tools/agents/config/skills

      - name: Summary
        if: always()
        run: |
          echo "=== Test Summary ==="
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Runner OS: ${{ runner.os }}"

          if [[ "${{ job.status }}" == "success" ]]; then
            echo "🎉 All Claude skill tests passed!"
          else
            echo "❌ Some tests failed. Check the logs above for details."
          fi
