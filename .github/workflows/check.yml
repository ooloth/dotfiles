name: Check

# Every push and pull request runs every check, so CI matches `bash scripts/check.bash`. The steps
# run in the same order, fastest first, and a failed step skips the slower ones after it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Check
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `latest-known` installs the newest uv whose checksum ships inside this pinned action, so a
      # new uv reaches CI only through a Dependabot bump and its 7-day cooldown. Without it, CI takes
      # each uv release the day it ships, checked only against the checksum its own server lists.
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known

      - name: Install shellcheck
        run: brew install shellcheck

      # tools/rex/tests run init.lua under LuaJIT, for the Lua 5.1 that Rex embeds
      - name: Install luajit
        run: brew install luajit

      # Every script starts with `#!/usr/bin/env bash`, so this is the bash the checks run them with
      - name: Show bash version
        run: command -v bash && bash --version | head -n 1

      - name: Format
        run: bash scripts/checks/formatting.bash

      - name: Docs
        run: uv run scripts/checks/docs.py

      - name: Types
        run: bash scripts/checks/types.bash

      - name: Lint
        run: bash scripts/checks/linting.bash

      - name: Tests
        run: bash scripts/checks/tests.bash
