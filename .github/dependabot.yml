# Keeps the SHA-pinned actions in .github/workflows current.
#
# Version updates arrive at most monthly, and only for releases at least 7 days old, so a
# compromised release has time to be found and pulled. Minor and patch updates are grouped into
# one PR. Majors open as their own PRs, so one breaking upgrade cannot block the rest, and the PR
# limit leaves room for them beside the group. Security updates ignore the version-update groups
# and would open one PR per action, so they get their own group.
#
# Dependabot covers only the actions. It does not read the ruff and ty versions pinned in
# scripts/checks/versions.bash or the dependencies in each uv script's inline header, so those are
# updated by hand. The pyproject.toml under @archive belongs to an archived skill, so no pip or uv
# entry covers it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
      actions-security:
        applies-to: security-updates
        patterns: ['*']
