# Applies to every Python file in the repo, for scripts/checks/types.bash and for editors.
# See: https://docs.astral.sh/ty/reference/configuration/
#
# The repo root as an import path is passed by types.bash as a flag, not set here, so an editor
# reading only this file reports an import such as `tools.github.repo_settings` as unresolved.

[environment]
python-version = "3.11"

[src]
# Archived skills are kept for reference and not maintained. ruff.toml excludes the same directory.
# ty globs treat @ as special, so it is escaped.
exclude = ["**/\\@archive/**"]
