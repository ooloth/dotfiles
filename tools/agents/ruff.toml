# Applies to every Python file under tools/agents/. Pinned here so a local run and CI check the
# same rules whatever ruff version is installed.
# See: https://docs.astral.sh/ruff/settings/

line-length = 100
target-version = "py311"

[lint]
select = [
    "E4",  # import placement
    "E7",  # statement errors
    "E9",  # syntax and io errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
